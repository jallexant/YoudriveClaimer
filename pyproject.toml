[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "youdrive-claimer"
version = "0.1.0"
description = "Local YouDrive trip and claim tracking, without automatic email sending"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["SQLAlchemy>=2.0,<3", "python-dotenv>=1.0,<2", "tzdata>=2025.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
youdrive = "youdrive.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
